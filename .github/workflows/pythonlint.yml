name: "Linting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  pylint:
    name: Python Code Quality and Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        linter-env: ["linting", "type_check", "spell_check"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: Run pylint
        if: matrix.linter-env == 'linting'
        run: uv run --locked --group linting pylint sapguimcp
      - name: Run mypy
        if: matrix.linter-env == 'type_check'
        run: uv run --locked --group type_check mypy --show-error-codes src/sapguimcp --strict
      - name: Run codespell
        if: matrix.linter-env == 'spell_check'
        run: |
          uv run --locked --group spell_check codespell --ignore-words=domain-specific-terms.txt src
          uv run --locked --group spell_check codespell --ignore-words=domain-specific-terms.txt README.md
