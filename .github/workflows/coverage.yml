name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    # Windows, so that the desktop (COM) unit tests run instead of skipping.
    # The job name stays "coverage" (required status check).
    runs-on: windows-latest

    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"

      - name: Run coverage
        shell: bash
        run: |
          uv run --locked --group coverage coverage run -m pytest -m "not integration"
          uv run --locked --group coverage coverage html --omit '.venv/*,unittests/*'
          uv run --locked --group coverage coverage report --fail-under 20 --omit '.venv/*,unittests/*'
