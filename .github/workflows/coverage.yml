name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"

      - name: Install Chromium for the browser unit tests
        run: uv run --locked --group coverage playwright install --with-deps chromium

      - name: Run coverage
        run: |
          uv run --locked --group coverage coverage run -m pytest -m "not integration"
          uv run --locked --group coverage coverage html --omit '.venv/*,unittests/*'
          uv run --locked --group coverage coverage report --fail-under 20 --omit '.venv/*,unittests/*'
