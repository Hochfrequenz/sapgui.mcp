name: Unittests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest]
        include:
          # The desktop (COM) unit tests skip on Linux. Run them on Windows too.
          # These add new check names, test (<version>, windows-latest); the
          # required ubuntu check names stay unchanged.
          - python-version: "3.11"
            os: windows-latest
          - python-version: "3.15"
            os: windows-latest
      fail-fast: false

    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked --group tests python -m pytest -m "not integration"
