[project]
name = "sapguimcp"
description = "MCP server for SAP Web GUI browser automation"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+pip@hochfrequenz.de" }]
keywords = ["mcp", "sap", "webgui", "browser", "automation", "playwright", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastmcp[apps]>=3.4.6,<4.0.0",  # FastMCP v3.2+ required for Choice provider (fastmcp.apps)
    "httpx>=0.27.0",  # HTTP client for GitHub API (feedback issue handler)
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    "rapidfuzz>=3.0.0",  # Fuzzy string matching for catalog search
    "sap-mcp-config>=1.1.0",  # Shared SAP system credentials config. >=1.1.0 for ${env:VAR} placeholders in systems.json, so credentials can come from the environment instead of being stored in the file (Hochfrequenz/sap-mcp-config#37).
    "sapsucker>=1.1.1",  # Typed SAP GUI Scripting wrapper. >=1.1.1 for the SAP GUI COM error 618 "Bad index type for collection access" workaround on collection.Item(int) (Hochfrequenz/sapsucker#61) — without it desktop sap_login spins to a 30s timeout on some Windows/SAP GUI 8.0 hosts (Hochfrequenz/sapgui.mcp#804). Earlier: >=0.6.1 for explicit wrap_com_object re-export (mypy --strict compat, sapsucker#47); >=0.5.1 for post-login client/user verification + parallel-multi-mandant safe behaviour (#24, #27); >=0.4.0 for GuiSession.GetObjectTree fast-path dump_tree.
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/sapgui.mcp/releases"
Homepage = "https://github.com/Hochfrequenz/sapgui.mcp"

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "anyio==4.14.2",  # includes pytest-anyio plugin for proper async fixture teardown
    "python-dotenv>=1.0.0",
    "beautifulsoup4==4.15.0",  # HTML parsing for selector unit tests
    "lxml==6.1.2",  # Fallback parser for Python 3.13+ (html.parser has stricter nesting rules)
    "respx==0.23.1",  # Mock httpx requests in tests
]
linting = [
    "ruff==0.16.5",
]
type_check = [
    "mypy[pydantic]==2.3.1",
    "types-PyYAML==6.0.12.20260518",
    { include-group = "tests" },
]
spell_check = [
    "codespell==2.4.2",
]
coverage = [
    "coverage==7.16.0",
    { include-group = "tests" },
]
build_executable = [
    "pyinstaller==6.22.2",
]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "spell_check" },
    { include-group = "coverage" },
]

[tool.uv]
default-groups = []

[project.scripts]
run-sapgui-mcp-server = "sapguimcp.server:main"

[tool.ruff]
line-length = 120
target-version = "py311"  # matches requires-python floor
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle-error
    "W",   # pycodestyle-warning
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "PL",  # pylint
    "RUF", # ruff-specific-rules
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "TC",  # flake8-type-checking
    "S",   # flake8-bandit
    "PIE", # flake8-pie
    "RSE", # flake8-raise
    "ISC", # flake8-implicit-str-concat
]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with `ruff format`)
]

[tool.ruff.lint.isort]
known-first-party = ["sapguimcp"]
known-third-party = ["sap_mcp_config", "sapsucker"]

[tool.ruff.lint.per-file-ignores]
# Tests: assertions are the point of a test suite (PLR2004 is already ignored globally).
"unittests/**" = [
    "S101", # assert
]

# --- Grandfathered pre-existing violations (generated; zero lint churn on existing code) ---
